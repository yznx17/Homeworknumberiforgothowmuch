3. نموذج التسجيل
أنشئ نموذجًا يحتوي على:
- الاسم الكامل، البريد الإلكتروني، رقم الهاتف وكلمة المرور.
- قائمة select لاختيار الدورة.
- أزرار radio لاختيار طريقة الدراسة: حضوري أو أونلاين.
- مربعات checkbox لاختيار المهارات: HTML وCSS وJavaScript.
- حقل لرفع صورة شخصية، ومساحة textarea لكتابة ملاحظات.
- زر Register وزر Reset.
شروط التمرين:
- اجمع المعلومات الشخصية داخل fieldset مع عنوان باستخدام legend.
- اجعل الاسم والبريد الإلكتروني وكلمة المرور حقولًا مطلوبة.
- اربط كل حقل بالـ label المناسب.
- استخدم name وvalue حيث يلزم.
- أضف بعض الـ placeholder المناسبة -->
